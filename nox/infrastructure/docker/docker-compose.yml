# NOX local stack: Postgres, Redis, MinIO (S3), backend API.
#
# Run from this directory, pointing Compose at the repo-root .env so that
# ${VAR} interpolation below uses the same values as the backend:
#   cp ../../.env.example ../../.env   # first time only
#   docker compose --env-file ../../.env up -d --build
#
# Infra-only (run the backend on the host with `npm run start:dev`):
#   docker compose --env-file ../../.env up -d postgres redis minio minio-init
#
# Note: no top-level `name:` is set, so the project name stays "docker" (this
# directory) and the existing docker_nox_postgres_data volume is reused.

services:
  postgres:
    image: postgres:16-alpine
    container_name: nox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nox_db}
    ports:
      # Host 5433 avoids clashing with a locally installed Postgres.
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - nox_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nox

  redis:
    image: redis:7-alpine
    container_name: nox-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - nox_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nox

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: nox-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      # MinIO root credentials double as the backend's S3 access keys.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set in .env}
    ports:
      - '${MINIO_API_HOST_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_HOST_PORT:-9001}:9001' # Web console
    volumes:
      - nox_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nox

  # One-shot job: create the bucket the backend expects, then exit.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: nox-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-nox-files}
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
      mc mb --ignore-existing "local/$${S3_BUCKET}" &&
      mc anonymous set none "local/$${S3_BUCKET}"
      '
    restart: 'no'
    networks:
      - nox

  backend:
    build:
      # Context is the nox/ repo root; the Dockerfile copies backend/ and database/.
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.backend
    image: nox-backend:local
    container_name: nox-backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      # Overrides: inside the network, services are reached by name on their
      # container ports, not via localhost / host-mapped ports from .env.
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nox_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nox_db}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
      - '${WS_PORT:-3001}:${WS_PORT:-3001}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- "http://localhost:$${PORT:-3000}/api/health" >/dev/null || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nox

networks:
  nox:
    name: nox-network
    driver: bridge

volumes:
  nox_postgres_data:
  nox_redis_data:
  nox_minio_data:
